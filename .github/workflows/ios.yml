name: Test and build iOS (unsigned, for sideloading)

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"

jobs:
  export:
    name: Test + generate Xcode project (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor and iOS template
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_RELEASE }}-ios-v1

      - name: Download Godot and the iOS export template
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
          # The template bundle is ~1.3 GB; keep only what iOS needs.
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz templates/ios.zip templates/version.txt -d "$dest"
          rm /tmp/templates.tpz

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Playthrough test
        run: ~/godot/godot --headless --path . --fixed-fps 60 res://tests/playthrough_test.tscn

      - name: Export Xcode project
        run: |
          mkdir -p build/ios
          ~/godot/godot --headless --path . --export-release "iOS" build/ios/Crispee.ipa
          test -d build/ios/Crispee.xcodeproj
          tar -C build -cf xcode-project.tar ios

      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: xcode-project.tar
          retention-days: 1
          compression-level: 6

  ios:
    name: Build unsigned .ipa (macOS)
    needs: export
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project

      - name: Unpack
        run: tar -xf xcode-project.tar

      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Crispee.xcodeproj \
            -scheme Crispee \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | tail -n 60

      - name: Package .ipa
        run: |
          app="$(find dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$app"
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry Crispee-unsigned.ipa Payload
          ls -lh Crispee-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Crispee-unsigned-ipa
          path: Crispee-unsigned.ipa
          retention-days: 14

      - name: Publish as a pre-release (easy download from a phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          short="$(echo "${{ github.sha }}" | cut -c1-7)"
          gh release create "$tag" Crispee-unsigned.ipa \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "CRISPEE build ${{ github.run_number }} (${{ github.ref_name }} @ $short)" \
            --notes "Unsigned iOS build for sideloading (AltStore / SideStore / Sideloadly re-sign it with your Apple ID). Branch: ${{ github.ref_name }}, commit $short."
