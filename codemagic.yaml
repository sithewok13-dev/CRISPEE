# Fallback iOS build on Codemagic's macOS machines, for when GitHub Actions
# isn't available. Same steps as .github/workflows/ios.yml: test, export the
# Xcode project with Godot, build unsigned, package an .ipa for sideloading.
workflows:
  ios-unsigned:
    name: CRISPEE unsigned iOS build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        GODOT_RELEASE: "4.7.2-stable"
        GODOT_VERSION: "4.7.2"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
    scripts:
      - name: Install Godot and the iOS export template
        script: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_RELEASE}_macos.universal.zip"
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz templates/ios.zip templates/version.txt -d "$dest"
          rm /tmp/templates.tpz
          echo "GODOT=$HOME/godot/Godot.app/Contents/MacOS/Godot" >> "$CM_ENV"
      - name: Import and test
        script: |
          "$GODOT" --headless --path . --import
          "$GODOT" --headless --path . --fixed-fps 60 res://tests/playthrough_test.tscn
      - name: Export Xcode project
        script: |
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS" build/ios/Crispee.ipa
          test -d build/ios/Crispee.xcodeproj
      - name: Build unsigned .ipa
        script: |
          set -o pipefail
          xcodebuild -project build/ios/Crispee.xcodeproj -scheme Crispee -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build | tail -n 60
          app="$(find dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          mkdir -p Payload && cp -R "$app" Payload/
          zip -qry Crispee-unsigned.ipa Payload
    artifacts:
      - Crispee-unsigned.ipa
